version: "3.9"

services:
  # ── ETL Pipeline ───────────────────────────────────────────────────────────
  etl:
    build: .
    container_name: medpacs-etl
    command: python main.py --input-dir /data/dicom_inbox
    volumes:
      - ./data/dicom_inbox:/data/dicom_inbox:ro
      - pipeline-output:/output
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - MEDPACS_DATA_DIR=/data
      - MEDPACS_OUTPUT_DIR=/output
    restart: "no"

  # ── REST API ───────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: medpacs-api
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - pipeline-output:/output:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - MEDPACS_OUTPUT_DIR=/output
    depends_on:
      - etl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Web Dashboard ──────────────────────────────────────────────────────────
  dashboard:
    build: .
    container_name: medpacs-dashboard
    command: python dashboard/app.py
    ports:
      - "5000:5000"
    volumes:
      - pipeline-output:/output:ro
    environment:
      - MEDPACS_OUTPUT_DIR=/output
    depends_on:
      - api
    restart: unless-stopped

  # ── DICOM C-STORE Listener ─────────────────────────────────────────────────
  dicom-listener:
    build: .
    container_name: medpacs-dicom-listener
    command: python dicom_listener/listener.py
    ports:
      - "11112:11112"   # Standard DICOM port
    volumes:
      - ./data/dicom_inbox:/data/dicom_inbox
      - pipeline-output:/output
    environment:
      - MEDPACS_DATA_DIR=/data
      - MEDPACS_OUTPUT_DIR=/output
      - DICOM_AE_TITLE=MEDPACS_SCP
      - DICOM_PORT=11112
    restart: unless-stopped

volumes:
  pipeline-output:
    driver: local
